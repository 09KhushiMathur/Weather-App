<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="shortcut icon" href="clouds-and-sun.png" type="image/x-icon">
    <style>

    </style>
</head>

<body>
    <section class="container">

        <div class="weather_header">
            <form class="weather_form">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Enter city name..." class="city_name">

            </form>
        </div>

        <!-- weather main data -->
        <div class="weather-body">
            <h1 class="weather_city"></h1>
            <p class="weather_date_time"></p>
            <div class="data">
                <p class="weather_forecast"> </p>
                <div class="weather_icon"></div>
            </div>
            <p class="weather_temperature"></p>
            <div class="minmax">
                <p class="weather_min"></p>
                <p class="weather_max"></p>
            </div>

        </div>
        <!-- weather extra data -->
        <section class="weather_info">
            <div class="weather_card">
                <i class="fa-solid fa-temperature-half"></i>
                <div>
                    <p>Feels Like</p>
                    <p class="weather_feelsLike">15&#176</p>
                </div>
            </div>
            <div class="weather_card">
                <i class="fa-solid fa-droplet"></i>

                <div>
                    <p>Humidity</p>
                    <p class="weater_Humidity">15&#176</p>
                </div>
            </div>
            <div class="weather_card">
                <i class="fa-solid fa-wind"></i>

                <div>
                    <p>Wind</p>
                    <p class="weather_wind">15&#176</p>
                </div>
            </div>
            <div class="weather_card">
                <i class="fa-solid fa-gauge-high"></i>
                <div>
                    <p>Pressure </p>
                    <p class="weather_Pressure">15&#176</p>
                </div>
            </div>
        </section>
        </div>
        <div class="timeBox">
        </div>
      
    </section>
    <script src="indx.js"></script>


</body>

</html>
